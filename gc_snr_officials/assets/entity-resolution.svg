<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1250" viewBox="0 0 1400 1250" role="img" aria-labelledby="title desc">
<title id="title">Close is not close enough when entity resolution matters</title>
<desc id="desc">A proposal to connect senior public servants' fragmented transparency records through a shared designated public office holder reference in Info Source. Source families include committee appearances, appointment briefing packages, travel, hospitality, lobbying communications, ethics and post-employment disclosures, audit committee remuneration and Orders in Council. Controlled recipients for briefing note titles would distinguish people, roles, institutions and effective dates. Dotted connections represent the proposed linkage through a shared reference.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#52718e" stroke-width="1.5"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#26374a}.eyebrow{font-size:14px;font-weight:700;letter-spacing:1.8px;fill:#a62a1e}.h{font-size:21px;font-weight:700}.body{font-size:17px;fill:#526170}.small{font-size:14px;fill:#526170}.label{font-size:13px;font-weight:700;letter-spacing:1px;fill:#526170}.source{fill:#fff;stroke:#d9e0e6;stroke-width:1.5}.link{fill:none;stroke:#7890a6;stroke-width:2;stroke-dasharray:5 6}.white{fill:#fff}.pale{fill:#d5e2ec}.alert{fill:#a62a1e}</style>
<rect width="1400" height="1250" rx="16" fill="#f4f7f9"/><path d="M16 0H1384Q1400 0 1400 16V7H0V16Q0 0 16 0" fill="#a62a1e"/>
<text x="52" y="57" class="eyebrow">GC SENIOR OFFICIALS · CONNECTING THE TRANSPARENCY RECORD</text>
<text x="52" y="119" font-size="49" font-weight="700" letter-spacing="-1.4">Close is not close enough</text>
<text x="52" y="166" font-size="34" fill="#526170">when entity resolution matters.</text>
<text x="52" y="207" class="body">Similar names are a starting point. Reliable linkage needs the right person, role, institution and dates.</text>
<rect x="52" y="238" width="1296" height="112" rx="10" fill="#fff" stroke="#d9e0e6"/>
<text x="76" y="268" class="label">ILLUSTRATIVE NAME VARIANTS</text>

<rect x="76" y="284" width="210" height="43" rx="6" fill="#eaf2f8"/><text x="92" y="312" font-size="20">A. Martin</text>
<rect x="306" y="284" width="210" height="43" rx="6" fill="#eaf2f8"/><text x="322" y="312" font-size="20">Alex Martin</text>
<rect x="536" y="284" width="210" height="43" rx="6" fill="#eaf2f8"/><text x="552" y="312" font-size="20">Alexandre Martin</text>
<g role="img" aria-label="Name similarity does not equal confirmed identity"><text x="785" y="311" font-size="21" font-weight="700" class="alert">Name similarity</text><path d="M953 297H974M953 305H974M971 289L957 315" stroke="#a62a1e" stroke-width="2.5" fill="none"/><text x="987" y="311" font-size="21" font-weight="700" class="alert">confirmed identity</text></g>
<text x="52" y="397" class="label">MANY SEPARATE RECORDS</text>
<text x="587" y="397" class="label">A SHARED REFERENCE</text>
<g id="schedule-i-count"><text x="757" y="438" text-anchor="middle" font-size="18" font-weight="700">148 institutions in Schedule I</text><text x="757" y="464" text-anchor="middle" class="body">Access to Information Act</text></g>
<text x="1010" y="397" class="label">BETTER RECIPIENT LINKAGE</text>

<path class="link" d="M497 452 H526 Q548 452 548 452 V675 H576"/>
<rect class="source" x="52" y="421" width="445" height="62" rx="8"/><rect x="52" y="433" width="4" height="38" rx="2" fill="#7890a6"/><text x="72" y="447" font-size="18" font-weight="700">Committee appearances</text><text x="72" y="469" class="small">Parliamentary appearance materials</text>
<path class="link" d="M497 528 H526 Q548 528 548 528 V675 H576"/>
<rect class="source" x="52" y="497" width="445" height="62" rx="8"/><rect x="52" y="509" width="4" height="38" rx="2" fill="#7890a6"/><text x="72" y="523" font-size="18" font-weight="700">Appointment briefing packages</text><text x="72" y="545" class="small">Briefings provided when a person takes office</text>
<path class="link" d="M497 604 H526 Q548 604 548 604 V675 H576"/>
<rect class="source" x="52" y="573" width="445" height="62" rx="8"/><rect x="52" y="585" width="4" height="38" rx="2" fill="#7890a6"/><text x="72" y="599" font-size="18" font-weight="700">Travel &amp; hospitality</text><text x="72" y="621" class="small">Expense disclosures</text>
<path class="link" d="M497 680 H526 Q548 680 548 680 V675 H576"/>
<rect class="source" x="52" y="649" width="445" height="62" rx="8"/><rect x="52" y="661" width="4" height="38" rx="2" fill="#7890a6"/><text x="72" y="675" font-size="18" font-weight="700">Lobbying communications</text><text x="72" y="697" class="small">DPOH names and communication dates</text>
<path class="link" d="M497 756 H526 Q548 756 548 756 V675 H576"/>
<rect class="source" x="52" y="725" width="445" height="62" rx="8"/><rect x="52" y="737" width="4" height="38" rx="2" fill="#7890a6"/><text x="72" y="751" font-size="18" font-weight="700">Ethics &amp; post-employment</text><text x="72" y="773" class="small">Asset disclosures and restrictions</text>
<path class="link" d="M497 832 H526 Q548 832 548 832 V675 H576"/>
<rect class="source" x="52" y="801" width="445" height="62" rx="8"/><rect x="52" y="813" width="4" height="38" rx="2" fill="#7890a6"/><text x="72" y="827" font-size="18" font-weight="700">Appointments &amp; remuneration</text><text x="72" y="849" class="small">Orders in Council: appointments and pay</text>
<path class="link" d="M497 908 H526 Q548 908 548 908 V675 H576"/>
<rect class="source" x="52" y="877" width="445" height="62" rx="8"/><rect x="52" y="889" width="4" height="38" rx="2" fill="#7890a6"/><text x="72" y="903" font-size="18" font-weight="700">Departmental Audit Committees</text><text x="72" y="925" class="small">Public remuneration reporting</text>
<rect x="576" y="493" width="363" height="366" rx="15" fill="#26374a"/>
<rect x="600" y="517" width="315" height="30" rx="15" fill="#40556b"/>
<text x="757" y="537" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1" class="white">PROPOSED · IN INFO SOURCE</text>
<g id="dpoh-person-icon" role="img" aria-label="Person"><title>Person icon drawn with SVG shapes</title><circle cx="757" cy="587" r="17" fill="#c5dbe9"/><path d="M724 630Q724 606 757 606Q790 606 790 630Z" fill="#c5dbe9"/></g>
<text x="757" y="670" text-anchor="middle" font-size="34" font-weight="700" class="white">DPOH reference</text>
<text x="757" y="696" text-anchor="middle" font-size="15" class="pale">Designated public office holder</text>
<path d="M603 716H912" stroke="#587087"/>
<text x="604" y="746" font-size="17" class="white">Stable person identifier</text>
<text x="604" y="775" font-size="17" class="white">Institution + dated role</text>
<text x="604" y="804" font-size="17" class="white">Source evidence + provenance</text>
<text x="604" y="833" font-size="17" class="white">Reviewed identity links</text>
<path d="M939 675H970V556H1002" class="link" marker-end="url(#arrow)"/>
<rect x="1010" y="421" width="338" height="242" rx="10" fill="#fff" stroke="#d9e0e6"/>
<text x="1032" y="455" class="h">Briefing note titles</text>
<text x="1032" y="487" class="body">Use a controlled recipient list</text>
<text x="1032" y="512" class="body">linked to the shared reference.</text>
<rect x="1032" y="535" width="294" height="43" rx="6" fill="#eaf2f8"/>
<g aria-label="Recipient identifier linked to dated role"><text x="1047" y="562" font-size="17" font-weight="700">Recipient ID</text><path d="M1153 556H1176M1169 550L1176 556L1169 562" stroke="#26374a" stroke-width="2" fill="none"/><text x="1185" y="562" font-size="17" font-weight="700">dated role</text></g>
<text x="1032" y="609" class="body">Keep the person distinct from</text>
<text x="1032" y="634" class="body">the position they hold.</text>
<rect x="1010" y="687" width="338" height="214" rx="10" fill="#eaf2f8"/>
<text x="1032" y="722" class="h">Large departments</text>
<text x="1032" y="756" class="body">Multiple deputy heads.</text>
<text x="1032" y="783" class="body">Sometimes multiple ministers.</text>
<path d="M1032 804H1326" stroke="#c3d4e1"/>
<text x="1032" y="833" class="body">A title alone cannot reliably</text>
<text x="1032" y="858" class="body">identify the intended recipient.</text>
<text x="576" y="934" class="small">Dotted lines show proposed connections.</text>
<rect x="52" y="998" width="1296" height="193" rx="12" fill="#e9f4ef" stroke="#bcdccc"/>
<rect x="52" y="998" width="6" height="193" rx="3" fill="#13795b"/>
<text x="80" y="1043" font-size="29" font-weight="700" fill="#155b46">A common anchor for a fractured information space.</text>
<text x="80" y="1082" font-size="20">We may not capture every use. Making DPOH references part of Info Source could help</text>
<text x="80" y="1112" font-size="20">connect these records while preserving their source, context and identity uncertainty.</text>
<text x="80" y="1156" font-size="15" fill="#155b46">START WITH SHARED IDENTIFIERS, DATED ROLES AND TRACEABLE SOURCE EVIDENCE.</text>
<text x="52" y="1225" class="small">GC Senior Officials Transparency · Concept diagram · November 2026</text>
</svg>
