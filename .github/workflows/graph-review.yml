name: Validate PIB PIA graph

on:
  pull_request:
    paths:
      - 'site/**'
      - 'scripts/*graph.py'
      - 'scripts/import_service_inventory.py'
      - 'data/service_inventory/**'
      - 'tests/test_service_inventory.py'
      - 'validate_data_model.py'
      - 'scripts/build_network_schema.py'
      - 'data_model.json'
      - 'tests/test_network_schema.py'
      - 'tests/network-schema.browser.cjs'
      - 'tests/document-studio*'
      - 'tests/test_document_studio.py'
      - 'tests/service-inventory.browser.cjs'
      - 'build_site_assets.py'
      - 'validate_site.py'
      - 'tests/*graph*'
      - 'tests/aia.test.mjs'
      - 'PIAs/**'
      - 'institution_registry.csv'
      - 'institutions_infosource_docs/*.csv'
      - 'spib_en_fr.csv'
      - 'standard_classes_of_records_en_fr.csv'
      - 'pi_categories_en_fr.csv'
      - 'pib_type_values.csv'
      - 'my_info/categories.py'
      - '.github/workflows/graph-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install validation dependencies
        run: |
          python -m pip install beautifulsoup4 'Markdown>=3.7,<4' 'jsonschema>=4.23,<5'
          npm install --prefix /tmp/graph-browser playwright@1.56.1
          /tmp/graph-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Validate canonical graph and site
        run: |
          python validate_site.py
          python -m unittest tests.test_network_schema tests.test_build_graph tests.test_service_inventory tests.test_build_pia_site
          node --test tests/graph-focus.test.mjs tests/graph.test.mjs tests/privacy_assessments.test.mjs tests/aia.test.mjs
          node --check site/aia-data.mjs
          node --check site/link-aia.mjs
          node --check site/graph.mjs
          node --check site/graph-focus.mjs
          python -m unittest tests.test_document_studio
          node --test tests/document-studio.test.mjs
          node --check site/document-studio/studio.mjs
          node --check site/document-studio/model.mjs
          node --check site/document-studio/markdown.mjs
          node --check site/document-studio/vocabulary.mjs
          node --check site/data-model.mjs
          node --check site/graph-attributes.mjs
      - name: Check graph in Chromium
        env:
          NODE_PATH: /tmp/graph-browser/node_modules
          GRAPH_TEST_OUTPUT: work
        run: |
          python -m http.server 8766 --directory site > /tmp/graph-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8766/graph.html > /dev/null; then break; fi
            sleep 1
          done
          node tests/graph.browser.cjs
          node tests/network-schema.browser.cjs
          node tests/document-studio.browser.cjs
          node tests/service-inventory.browser.cjs
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graph-browser-screenshots
          path: work/*.png
