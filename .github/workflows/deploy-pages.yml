name: Deploy GitHub Pages (pages branch)

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "!site/my_info/**"
      - "!site/my_info_v2/**"
      - "!site/my_info_compare/**"
      - "spib_en_fr.csv"
      - "pi_categories_en_fr.csv"
      - "standard_classes_of_records_en_fr.csv"
      - "pib_type_values.csv"
      - "infosource_institutions_en_fr.csv"
      - "institution_registry.csv"
      - "institutions_infosource_docs/pib_table_en_fr_all.csv"
      - "institutions_infosource_docs/cor_table_en_fr_all.csv"
      - "institutions_infosource_docs/pib_cor_links.csv"
      - "data/collection_jobs/institution_collection_summary_2026-08-15.json"
      - "data/collection_jobs/institution_collection_status_2026-08-15.csv"
      - "PIAs/**"
      - "scripts/build_pia_site.py"
      - "scripts/validate_pia_site.py"
      - "scripts/build_graph.py"
      - "scripts/service_graph.py"
      - "scripts/import_service_inventory.py"
      - "data/service_inventory/**"
      - "data/public_accounts/**"
      - "scripts/public_accounts.py"
      - "scripts/infobase_program_keys.py"
      - "tests/test_service_inventory.py"
      - "scripts/build_network_schema.py"
      - "data_model.json"
      - "validate_data_model.py"
      - "tests/test_network_schema.py"
      - "tests/test_document_studio.py"
      - "tests/document-studio*.mjs"
      - "tests/inspect_document_studio_pdf.py"
      - "tests/document-studio.browser.cjs"
      - "tests/graph-focus.test.mjs"
      - "scripts/validate_graph.py"
      - "my_info/categories.py"
      - "tests/test_build_graph.py"
      - "tests/graph.test.mjs"
      - "tests/aia.test.mjs"
      - "tests/graph.browser.cjs"
      - "tests/test_build_pia_site.py"
      - "tests/privacy_assessments.test.mjs"
      - "tests/privacy_assessments.browser.cjs"
      - "requirements.txt"
      - "build_site_assets.py"
      - "validate_site.py"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-branch-deploy
  queue: max
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install site build dependencies
        run: python -m pip install --disable-pip-version-check beautifulsoup4 "Markdown>=3.7,<4" "jsonschema>=4.23,<5" "pdfplumber>=0.11,<0.12"

      - name: Sync dataset files into site payload
        run: |
          mkdir -p site/data
          cp spib_en_fr.csv site/data/spib_en_fr.csv
          cp pi_categories_en_fr.csv site/data/pi_categories_en_fr.csv
          cp standard_classes_of_records_en_fr.csv site/data/standard_classes_of_records_en_fr.csv
          cp pib_type_values.csv site/data/pib_type_values.csv
          cp infosource_institutions_en_fr.csv site/data/infosource_institutions_en_fr.csv
          cp institution_registry.csv site/data/institution_registry.csv
          cp institutions_infosource_docs/pib_table_en_fr_all.csv site/data/pib_table_en_fr_all.csv
          cp institutions_infosource_docs/cor_table_en_fr_all.csv site/data/cor_table_en_fr_all.csv
          cp institutions_infosource_docs/pib_cor_links.csv site/data/pib_cor_links.csv
          python build_site_assets.py

      - name: Validate generated site
        run: |
          python -m pip install --disable-pip-version-check beautifulsoup4
          python validate_site.py
          python -m unittest tests.test_build_pia_site
          python -m unittest discover -s PIAs -p "test_reference_*.py"
          node --test tests/privacy_assessments.test.mjs
          node --check site/privacy-assessments.js
          node --check site/privacy-assessment.js
          python -m unittest tests.test_network_schema tests.test_build_graph tests.test_service_inventory
          node --test tests/graph-focus.test.mjs tests/graph.test.mjs tests/aia.test.mjs
          node --check site/aia-data.mjs
          node --check site/link-aia.mjs
          node --check site/graph.mjs
          node --check site/graph-focus.mjs
          python -m unittest tests.test_document_studio
          node --test tests/document-studio.test.mjs tests/document-studio-pdf.test.mjs
          node --check site/document-studio/studio.mjs
          node --check site/document-studio/model.mjs
          node --check site/document-studio/markdown.mjs
          node --check site/document-studio/vocabulary.mjs
          node --check site/document-studio/atip-validation.mjs
          node --check site/document-studio/metadata.mjs
          node --check site/document-studio/pdf.mjs
          node --check site/data-model.mjs
          node --check site/graph-attributes.mjs

      - name: Prepare independent main-site payload
        run: |
          mkdir -p _site_root
          rsync -a --delete --exclude "my_info/" --exclude "my_info_v2/" --exclude "my_info_compare/" site/ _site_root/

      - name: Deploy to pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: pages
          folder: _site_root
          clean: true
          clean-exclude: |
            my_info/**
            my_info_v2/**
            my_info_compare/**
            gc_snr_officials/**
          force: false

