name: Deploy GitHub Pages (pages branch)

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "spib_en_fr.csv"
      - "pi_categories_en_fr.csv"
      - "standard_classes_of_records_en_fr.csv"
      - "pib_type_values.csv"
      - "infosource_institutions_en_fr.csv"
      - "institution_registry.csv"
      - "institutions_infosource_docs/pib_table_en_fr_all.csv"
      - "institutions_infosource_docs/cor_table_en_fr_all.csv"
      - "institutions_infosource_docs/pib_cor_links.csv"
      - "data/collection_jobs/institution_collection_summary_2026-08-15.json"
      - "data/collection_jobs/institution_collection_status_2026-08-15.csv"
      - "build_site_assets.py"
      - "scripts/build_my_info_web.py"
      - "my_info/web/**"
      - "my_info/agent_tools.py"
      - "packages/my-info-mcp/src/engine.mjs"
      - "data/derived/my_info/my_info_questionnaire.json"
      - "data/derived/my_info/my_info_pib_features.csv"
      - "validate_site.py"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync dataset files into site payload
        run: |
          mkdir -p site/data
          cp spib_en_fr.csv site/data/spib_en_fr.csv
          cp pi_categories_en_fr.csv site/data/pi_categories_en_fr.csv
          cp standard_classes_of_records_en_fr.csv site/data/standard_classes_of_records_en_fr.csv
          cp pib_type_values.csv site/data/pib_type_values.csv
          cp infosource_institutions_en_fr.csv site/data/infosource_institutions_en_fr.csv
          cp institution_registry.csv site/data/institution_registry.csv
          cp institutions_infosource_docs/pib_table_en_fr_all.csv site/data/pib_table_en_fr_all.csv
          cp institutions_infosource_docs/cor_table_en_fr_all.csv site/data/cor_table_en_fr_all.csv
          cp institutions_infosource_docs/pib_cor_links.csv site/data/pib_cor_links.csv
          python build_site_assets.py
          python scripts/build_my_info_web.py

      - name: Validate generated site
        run: |
          python -m pip install --disable-pip-version-check beautifulsoup4
          python validate_site.py
          python -m unittest tests.test_build_my_info_web
          node --check site/my-info/app.mjs
          node --check site/my-info/engine.mjs

      - name: Deploy to pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: pages
          folder: site
          clean: true
